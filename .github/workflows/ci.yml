name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Lint · Test · Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app/

      - name: Run tests
        run: pytest tests/ -v

      - name: Build Docker image
        run: docker build -t hackathon-app:${{ github.sha }} .

      - name: Push to GHCR
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo $GITHUB_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/roma-rgb-tech/devsecops-pipeline-demo:${{ github.sha }} .
          docker push ghcr.io/roma-rgb-tech/devsecops-pipeline-demo:${{ github.sha }}

      - name: Trivy — generate JSON report for Splunk
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "json"
          output: "trivy-results.json"
          severity: "CRITICAL,HIGH"

      - name: Send Trivy Results to Splunk
        env:
          SPLUNK_URL: ${{ secrets.SPLUNK_HEC_URL }}
          SPLUNK_TOKEN: ${{ secrets.SPLUNK_HEC_TOKEN }}
        run: |
          PAYLOAD=$(jq -n --argjson event "$(<trivy-results.json)" '{sourcetype: "_json", event: $event}')
          
          curl -k -X POST "$SPLUNK_URL" \
            -H "Authorization: Splunk $SPLUNK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Trivy — scan filesystem (Console Output & Fail)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1" 
          severity: "CRITICAL,HIGH"

      - name: Notify Telegram
        if: always()
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ job.status == 'success' && '✅' || '❌' }} CI — ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}
            Actor: ${{ github.actor }}