name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Update image tag in GitOps repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/Roma-rgb-tech/devsecops-gitops.git
          cd devsecops-gitops

          NEW_IMAGE="ghcr.io/roma-rgb-tech/devsecops-pipeline-demo:${{ github.sha }}"
          sed -i "s|image:.*|image: ${NEW_IMAGE}|g" k8s/deployment.yml

          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add k8s/deployment.yml
          git commit -m "ci: update image to ${{ github.sha }}"
          git push

      - name: Notify Telegram — Deploy
        if: always()
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ job.status == 'success' && '🚀 Deployed!' || '💥 Deploy failed' }}
            Repo: ${{ github.repository }}
            URL: ${{ secrets.RAILWAY_PUBLIC_URL }}
