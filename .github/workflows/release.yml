name: Release
on:
     workflow_run:
       workflows: ["CI"]
       types: [completed]
       branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Tag release image
        run: |
          docker tag ghcr.io/roma-rgb-tech/devsecops-pipeline-demo:${{ github.sha }} \
            ghcr.io/roma-rgb-tech/devsecops-pipeline-demo:v${{ steps.release.outputs.new_release_version }}
          docker push ghcr.io/roma-rgb-tech/devsecops-pipeline-demo:v${{ steps.release.outputs.new_release_version }}